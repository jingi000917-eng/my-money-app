  <script>
  'use strict';
  (() => {
    const KEY = 'mymoney_v01_vault';
    const ITERATIONS = 250000;
    const $ = (q,root=document) => root.querySelector(q);
    const $$ = (q,root=document) => [...root.querySelectorAll(q)];
    const money = n => Number.isFinite(Number(n)) ? '¥' + Math.round(Number(n)).toLocaleString('ja-JP') : '未登録';
    const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const has = v => v !== null && v !== undefined && v !== '' && Number.isFinite(Number(v));
    const maybeMoney = n => has(n) ? money(n) : '未登録';
    const dec = new TextDecoder(), enc = new TextEncoder();
    const b64 = data => { let out=''; for(let i=0;i<data.length;i+=8192) out+=String.fromCharCode(...data.subarray(i,i+8192)); return btoa(out); };
    const bytes = str => Uint8Array.from(atob(str),c=>c.charCodeAt(0));
    const randomId = () => crypto.randomUUID ? crypto.randomUUID() : b64(crypto.getRandomValues(new Uint8Array(16)));
    const blankFinance = () => ({salary:null,salaryMin:null,salaryMax:null,
      fixed:[{name:'住宅ローン（月額）',amount:null},{name:'生命保険・医療保険等',amount:null},{name:'学資保険',amount:null},{name:'自動車保険',amount:null},{name:'親族の住居関連',amount:null}],
      bonusMortgage:null,bonusTimes:2,propertyTaxAnnual:null,carInspectionTwoYears:null,carTaxAnnual:null,lessonMonthly:null,
      cardNewLow:null,cardNewHigh:null,cardInstallmentsIncludingFees:null,cardSchedule:[],
      gasMonthlyLow:null,gasMonthlyHigh:null,furusatoAnnual:null,furusatoReserveEnabled:false,expenseProfile:null,incomeHistory:[],companyAdvances:[],companyReimbursementNote:'',lastReviewed:'',reviewNotes:[],progressMonths:[],profileImported:false});
    const RESULTS_START='2026-12'; // A results window, not a bank-asset baseline.
    const expenseFields = [
      ['supermarket','スーパー・生鮮食品'],['dining','店舗外食（会社経費・奢り除く）'],
      ['delivery','デリバリー・持ち帰り'],['convenience','コンビニ直接決済'],
      ['foodOnline','食品・飲料通販（水以外）']
    ];
    const blankExpenses=()=>({period:'',category:{supermarket:null,dining:null,delivery:null,convenience:null,foodOnline:null},
      drugstore:null,water:null,tobacco:null,entertainment:null,notes:[],updatedAt:''});
    const yenVal = n => has(n)?money(n):'未確認';
    const monthName = m => {const [y,mm]=String(m).split('-');return `${y}年${Number(mm)}月`;};
    const moneySigned = n => n < 0 ? '−'+money(Math.abs(n)) : '＋'+money(n);
    function financeCalc(){
      const f=state.finance||blankFinance();
      const bankFixed=total((f.fixed||[]).map(v=>has(v.amount)?v.amount:0));
      const aLoan=state.accounts.find(a=>a.id==='loan-1');
      const aPayment=has(aLoan?.monthly)?Number(aLoan.monthly):0;
      const bonus=has(f.bonusMortgage)?Number(f.bonusMortgage)*Number(f.bonusTimes||0)/12:0;
      const property=has(f.propertyTaxAnnual)?Number(f.propertyTaxAnnual)/12:0;
      const inspection=has(f.carInspectionTwoYears)?Number(f.carInspectionTwoYears)/24:0;
      const carTax=has(f.carTaxAnnual)?Number(f.carTaxAnnual)/12:0;
      const lesson=has(f.lessonMonthly)?Number(f.lessonMonthly):0;
      const furusato= f.furusatoReserveEnabled===true && has(f.furusatoAnnual) ? Number(f.furusatoAnnual)/12 : 0;
      const fixed=bankFixed+aPayment+bonus+property+inspection+carTax+lesson+furusato;
      const midCard=has(f.cardNewLow)&&has(f.cardNewHigh)?(Number(f.cardNewLow)+Number(f.cardNewHigh))/2:null;
      const salary=has(f.salary)?Number(f.salary):null;
      return {f,bankFixed,aPayment,bonus,property,inspection,carTax,lesson,furusato,fixed,midCard,salary};
    }
    const monthAdd=(ym,delta)=>{const [y,m]=String(ym).split('-').map(Number);const d=new Date(Date.UTC(y,m-1+delta,1));return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`;};
    function monthlyOutlook(c){
      const f=c.f,sc=f.forecastScenario||'base';
      const salary=sc==='low'?(has(f.salaryMin)?Number(f.salaryMin):c.salary):sc==='high'?(has(f.salaryMax)?Number(f.salaryMax):c.salary):c.salary;
      const regular=sc==='low'?(has(f.cardNewHigh)?Number(f.cardNewHigh):c.midCard):sc==='high'?(has(f.cardNewLow)?Number(f.cardNewLow):c.midCard):c.midCard;
      if(salary===null||regular===null)return [];
      const existing=Array.isArray(f.cardSchedule)?f.cardSchedule:[];
      const planned=new Map(existing.filter(x=>/^20\d{2}-(0[1-9]|1[0-2])$/.test(x.month)&&Number.isSafeInteger(Number(x.amount))&&Number(x.amount)>=0).map(x=>[x.month,Number(x.amount)]));
      const chosenStart=/^20\d{2}-(0[1-9]|1[0-2])$/.test(f.forecastStartMonth||'')?f.forecastStartMonth:(existing.length?existing.map(x=>x.month).sort()[0]:monthAdd(nowLocal().slice(0,7),1));
      const start=chosenStart<RESULTS_START?RESULTS_START:chosenStart;
      return Array.from({length:12},(_,idx)=>{
        const month=monthAdd(start,idx),known=planned.has(month),old=known?planned.get(month):null;
        const delta=known?Math.round(salary-c.fixed-regular-old):null;
        return {month,old,regular,salary,known,delta};
      });
    }
    const blankData = () => ({schema:1,createdAt:new Date().toISOString(),accounts:[
      {id:'card-1',kind:'card',name:'クレジットカード 1',dueDay:null,note:'',items:[]},
      ...[1,2,3].map(i=>({id:'loan-'+i,kind:'loan',name:'カードローン '+i,dueDay:null,balance:null,monthly:null,apr:null,note:''}))
    ],payments:[],finance:blankFinance(),chatMessages:[],paymentChecks:[],chatDraft:null,updatedAt:new Date().toISOString()});
    let state = null, encryptionKey = null, salt = null, pendingSave = Promise.resolve(), page='home', editing=null, idleTimer;
    const nowLocal = () => {const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
    const safeNumber = value => value==='' || value===null || value===undefined ? null : Number(value);
    const typeName = a => a.kind === 'card' ? 'クレジットカード（分割）' : 'カードローン・キャッシング';
    const principal = a => a.kind === 'card' ? a.items.reduce((s,i)=>s+(has(i.balance)?Number(i.balance):0),0) : (has(a.balance)?Number(a.balance):0);
    const monthly = a => a.kind === 'card' ? a.items.reduce((s,i)=>s+(has(i.monthly)?Number(i.monthly):0),0) : (has(a.monthly)?Number(a.monthly):0);
    const registered = a => a.kind === 'card' ? a.items.some(i=>has(i.balance)) : has(a.balance);
    const total = xs => xs.reduce((s,x)=>s+Number(x||0),0);
    const fmtDate = v => v ? String(v).replaceAll('-','/') : '—';
    const due = day => {
      if(!has(day))return '未設定';
      const d=new Date();let y=d.getFullYear(),m=d.getMonth();
      const make = (yy,mm) => new Date(yy,mm,Math.min(Number(day),new Date(yy,mm+1,0).getDate()));
      let next=make(y,m);if(next < new Date(y,m,d.getDate())) next=make(y,m+1);
      return `${next.getFullYear()}/${next.getMonth()+1}/${next.getDate()}`;
    };
    const msg = (message) => alert(message);
    const setLoginError = t => {$('#login-error').textContent=t;$('#login-error').classList.toggle('hidden',!t);};
    const readVault = () => {try{return JSON.parse(localStorage.getItem(KEY)||'null');}catch{return null;}};
    const validateVault = v => !!(v && v.v===1 && typeof v.salt==='string' && typeof v.iv==='string' && typeof v.ciphertext==='string' && Number(v.iterations)>=100000 && Number(v.iterations)<=1000000);
    const derive = async(pass, saltData, rounds) => {
      const material=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:saltData,iterations:rounds,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
    };
    const decryptVault = async(v, pass) => {
      if(!validateVault(v)) throw Error('バックアップ形式が正しくありません');
      const k=await derive(pass,bytes(v.salt),v.iterations);
      const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(v.iv)},k,bytes(v.ciphertext));
      const data=JSON.parse(dec.decode(raw));
      if(!validateData(data)) throw Error('保存データが壊れています');
      return {data,key:k,salt:bytes(v.salt)};
    };
    const validateData = d => !!(d && d.schema===1 && Array.isArray(d.accounts) && d.accounts.length===4 && d.accounts.filter(a=>a.kind==='card').length===1 && d.accounts.filter(a=>a.kind==='loan').length===3 && d.accounts.every(a=>typeof a.id==='string' && typeof a.name==='string' && (a.kind==='loan'||Array.isArray(a.items))) && Array.isArray(d.payments));
    const save = () => {
      if(!state||!encryptionKey||!salt)return Promise.resolve();
      state.updatedAt=new Date().toISOString();
      const snapshot=JSON.stringify(state);
      pendingSave=pendingSave.catch(()=>{}).then(async()=>{
        const iv=crypto.getRandomValues(new Uint8Array(12));
        const data=await crypto.subtle.encrypt({name:'AES-GCM',iv},encryptionKey,enc.encode(snapshot));
        const v={v:1,iterations:ITERATIONS,salt:b64(salt),iv:b64(iv),ciphertext:b64(new Uint8Array(data))};
        localStorage.setItem(KEY,JSON.stringify(v));
      }).catch(err=>{console.error('保存に失敗',err);msg('保存に失敗しました。ブラウザの空き容量と権限を確認してください。');});
      return pendingSave;
    };
    const resetIdle = () => {clearTimeout(idleTimer);if(state)idleTimer=setTimeout(()=>lock(true),15*60*1000);};
    const lock = (silent=false) => {state=null;encryptionKey=null;salt=null;clearTimeout(idleTimer);closeModal();$('#app').classList.add('hidden');$('#login').classList.remove('hidden');updateLogin();$('#pass').value='';$('#pass2').value='';setLoginError('');if(!silent)msg('ロックしました。');};
    function updateLogin(){const exists=!!readVault();$('#confirm-field').classList.toggle('hidden',exists);$('#login-desc').innerHTML=exists?'保存したデータを開くには、パスフレーズを入力してください。':'自分のペースで、返済を見える化。<br>最初に保存用のパスフレーズを設定します。';$('#login-submit').textContent=exists?'ロックを解除':'新しく始める';$('#pass').autocomplete=exists?'current-password':'new-password';}
    async function start(pass){
      const exists=readVault();
      if(exists){const result=await decryptVault(exists,pass);state=result.data;encryptionKey=result.key;salt=result.salt;}
      else{state=blankData();salt=crypto.getRandomValues(new Uint8Array(16));encryptionKey=await derive(pass,salt,ITERATIONS);await save();}
      if(!state.finance)state.finance=blankFinance();
      $('#login').classList.add('hidden');$('#app').classList.remove('hidden');page='home';render();resetIdle();
    }

    // Lightweight rule-based local conversation. NOT an external AI chat service.
    const chatPaidKinds=[
      {key:'rakuten',label:'楽天カード',rx:/楽天\s*(?:カード|ｶｰﾄﾞ)|楽天(?:の)?請求/i},
      {key:'insurance-study',label:'学資保険',rx:/学資保険/},
      {key:'insurance-car',label:'自動車保険',rx:/自動車保険|車の保険/},
      {key:'insurance-life',label:'生命・医療保険',rx:/生命保険|医療保険|生保/},
      {key:'insurance-general',label:'保険（種類未指定）',rx:/保険/},
      {key:'mortgage',label:'住宅ローン',rx:/住宅ローン/},
      {key:'free-loan',label:'フリーローン',rx:/フリーローン/},
      {key:'utilities-power',label:'電気代',rx:/電気代|電気料金/},
      {key:'utilities-gas',label:'ガス代',rx:/ガス代|ガス料金/},
      {key:'utilities-water',label:'水道代',rx:/水道代|水道料金/},
      {key:'mobile',label:'携帯・通信費',rx:/携帯代|携帯料金|通信費|スマホ代/}
    ];
    function chatMonth(text){
      const now=nowLocal(),ym=now.slice(0,7);
      const m=String(text).match(/(?:(20\d{2})年)?\s*(1[0-2]|0?[1-9])月(?:分)?/);
      if(!m)return ym;
      const month=Number(m[2]);
      // Without an explicit year use the closest past month, never a future billing month.
      let y=m[1]?Number(m[1]):Number(now.slice(0,4));
      if(!m[1]&&month>Number(now.slice(5,7)))y--;
      return y+'-'+String(month).padStart(2,'0');
    }
    function chatFindKinds(text){
      const match=chatPaidKinds.filter(x=>x.rx.test(text));
      const keys=new Set(match.map(x=>x.key));
      if([...keys].some(k=>k.startsWith('insurance-')&&k!=='insurance-general'))keys.delete('insurance-general');
      return match.filter(x=>keys.has(x.key));
    }
    function chatClean(){
      if(!Array.isArray(state.chatMessages))state.chatMessages=[];
      if(!Array.isArray(state.paymentChecks))state.paymentChecks=[];
    }
    // Guided local payment reconciliation. Never assumes that card billing is debt principal.
    const chatNow=()=>new Date().toISOString();
    const moneyInput=v=>{
      const s=String(v??'').replace(/[¥￥,，\s円]/g,'').trim();
      if(!s)return null;
      const m=s.match(/^(\d+(?:\.\d+)?)(万円|万|千円|千)?$/);
      const n=m?Number(m[1])*(m[2]==='万円'||m[2]==='万'?10000:m[2]?.startsWith('千')?1000:1):Number(s);
      return Number.isSafeInteger(n)&&n>=0&&n<=1e10?n:null;
    };
    function chatAdd(role,text){chatClean();state.chatMessages.push({id:randomId(),role,text,at:chatNow()});state.chatMessages=state.chatMessages.slice(-100);}
    const isCardKey=k=>k==='rakuten';
    function reviewItem(kind,month){
      let old=state.paymentChecks.find(x=>x.month===month&&x.key===kind.key&&x.status==='paid');
      if(!old&&kind.key==='insurance-general'){const ins=state.paymentChecks.filter(x=>x.month===month&&x.status==='paid'&&x.key.startsWith('insurance-'));if(ins.length===1)old=ins[0];}
      return {key:old?.key||kind.key,label:old?.label||kind.label,month,paidDate:old?.paidDate||nowLocal(),amount:Number.isSafeInteger(old?.amount)?old.amount:null,
        method:old?.method||'bank',detail:old?.detail||{},repayment:old?.repayment||null,oldId:old?.id||null};
    }
    function reviewStart(kinds,month){
      chatClean();
      const unique=[];
      kinds.forEach(k=>{if(!unique.some(x=>x.key===k.key))unique.push(reviewItem(k,month));});

      if(unique.some(x=>x.key==='insurance-general')){
        const old=state.paymentChecks.find(x=>x.month===month&&x.key==='insurance-general');
        if(old)unique.find(x=>x.key==='insurance-general').oldId=old.id;

    }
    function chatBeginFromCheck(id){
      const c=state.paymentChecks.find(x=>x.id===id);if(!c)return;

        method:c.method||'bank',detail:c.detail||{},repayment:c.repayment||null,oldId:c.id}],createdAt:chatNow()};
      chatAdd('assistant',monthName(c.month)+'分の「'+c.label+'」の金額と内訳を確認するね。確認が終わるまで登録内容は変更しないよ。');
    }
    function chatReply(text){
      chatClean();const month=chatMonth(text),kinds=chatFindKinds(text);

      if(/(?:確認をやめ|入力をやめ|キャンセル|中止)/.test(text)){

    }
    const insOpts=[['insurance-general','保険（種類不明）'],['insurance-life','生命・医療保険'],['insurance-study','学資保険'],['insurance-car','自動車保険']];
    function chatInsuranceSuggestion(key){
      const fixed=(state.finance?.fixed||[]);
      const patterns={ 'insurance-life':/生命保険|医療保険/, 'insurance-study':/学資保険/, 'insurance-car':/自動車保険/ };

    }
    function debtTargets(){

    function validReview(){
      const items=state.chatDraft?.items;
      if(!Array.isArray(items)||!items.length)throw Error('確認中の支払いがありません');
      const ids=new Set(),newLoanPayments=[];
      for(const x of items){
        if(!/^20\d{2}-(0[1-9]|1[0-2])$/.test(x.month))throw Error('対象月が正しくありません');
        if(!/^20\d{2}-\d{2}-\d{2}$/.test(x.paidDate)||Number.isNaN(new Date(x.paidDate+'T12:00:00').getTime()))throw Error('支払日を確認して');
        if(!Number.isSafeInteger(x.amount)||x.amount<=0)throw Error(x.label+'の支払額を入力して');
        const key=x.key+'|'+x.month;if(ids.has(key))throw Error('同じ月・同じ項目が重複している');ids.add(key);
        if(state.paymentChecks.some(c=>c.status==='paid'&&c.month===x.month&&c.key===x.key&&c.id!==x.oldId))throw Error(x.label+'の同月分がすでにあるよ。重複を確認してね');
        if(!isCardKey(x.key))continue;
        const values=Object.values(x.detail||{}).filter(v=>v!==null&&v!==undefined&&v!=='');
        if(values.some(v=>!Number.isSafeInteger(v)||v<0))throw Error('楽天カードの内訳は0円以上の整数で');
        const subtotal=values.reduce((t,v)=>t+v,0);
        if(subtotal>x.amount)throw Error('楽天カードの内訳合計が請求総額を超えているよ');
        const rep=x.repayment;
        if(!rep||!rep.target)continue;
        const target=debtTargets().find(t=>t.id===rep.target);if(!target)throw Error('返済先が登録されていないよ');
        const n=['principal','interest','fee'].map(k=>rep[k]===null||rep[k]===undefined||rep[k]===''?0:rep[k]);
        if(n.some(v=>!Number.isSafeInteger(v)||v<0)||n.reduce((a,b)=>a+b,0)<=0)throw Error('元金・利息・手数料を正しく入力して');
        const old=state.paymentChecks.find(c=>c.id===x.oldId);const oldPay=state.payments.find(p=>p.id===old?.linkedRepaymentId);
        const oldTarget=oldPay?(oldPay.itemId?oldPay.accountId+'::'+oldPay.itemId:oldPay.accountId):'';
        const available=target.balance+(oldTarget===rep.target?Number(oldPay.principal):0);
        if(n[0]>available)throw Error('元金の返済額が登録残高を超えているよ');
        if(state.payments.some(p=>p.id!==old?.linkedRepaymentId&&p.accountId===rep.target.split('::')[0]&&(p.itemId||'')===(rep.target.split('::')[1]||'')&&p.date===x.paidDate&&p.principal===n[0]&&p.interest===n[1]&&p.fee===n[2]))throw Error('同じ返済記録がすでにある可能性があるよ。返済一覧を確認してね');
        if(n.reduce((a,b)=>a+b,0)>x.amount)throw Error('返済内訳が楽天カードの支払総額を超えているよ');
        newLoanPayments.push({target:target.id,principal:n[0],interest:n[1],fee:n[2],month:x.month});
      }
      // Only one confirmed loan payment for a given item in one batch; other records checked individually.
      return items;
    }

    function resultsSummary(){
      const items=(state.payments||[]).filter(p=>p && typeof p.date==='string' && p.date.slice(0,7)>=RESULTS_START);
      const totalPrincipal=total(items.map(p=>p.principal));
      const totalCosts=total(items.map(p=>Number(p.interest||0)+Number(p.fee||0)));
      const byMonth=new Map();
      for(const p of items){
        const m=p.date.slice(0,7);
        if(!/^20\d{2}-(0[1-9]|1[0-2])$/.test(m))continue;
        const r=byMonth.get(m)||{principal:0,costs:0,count:0};
        r.principal+=Number(p.principal||0);r.costs+=Number(p.interest||0)+Number(p.fee||0);r.count++;
        byMonth.set(m,r);
      }
      const history=Array.isArray(state.finance?.progressMonths)?state.finance.progressMonths:[];
      const actuals=new Map(history.filter(x=>x&&/^20\d{2}-(0[1-9]|1[0-2])$/.test(x.month)&&x.month>=RESULTS_START).map(x=>[x.month,x]));
      return {items,totalPrincipal,totalCosts,byMonth,actuals};
    }
    function renderResults(){
      const r=resultsSummary(),current=nowLocal().slice(0,7),started=current>=RESULTS_START;

      const [sy,sm]=RESULTS_START.split('-').map(Number),[ey,em]=latest.split('-').map(Number);
      const n=Math.min(48,Math.max(12,(ey-sy)*12+em-sm+1));
      const months=Array.from({length:n},(_,i)=>monthAdd(RESULTS_START,i));
      const cardActuals=[...r.actuals.values()].filter(x=>Number.isSafeInteger(x.ordinaryCard)&&x.ordinaryCard>=0).sort((a,b)=>a.month.localeCompare(b.month));
      const lastCard=cardActuals.at(-1),prevCard=cardActuals.at(-2);
      const monthRows=months.map(m=>{
        const x=r.byMonth.get(m),a=r.actuals.get(m);
        const amount=x?money(x.principal):'—';
        const card=a && Number.isSafeInteger(a.ordinaryCard)?money(a.ordinaryCard):'未入力';

    const importSignature=e=>[e.sourceType,e.billingMonth||'',e.date,moneyImport.normalize(e.merchant),e.amount,moneyImport.normalize(e.method),moneyImport.normalize(e.cardholder)].join('|');
    function buildImportDedup(parsed){const db=importState();if(db.batches.some(b=>b.hash===parsed.hash))throw Error('このファイルは既に取り込み済みです。重複登録はしていません。');
      const oldCounts=new Map(),localCounts=new Map();
      for(const e of db.entries){const k=e.sig||importSignature(e);oldCounts.set(k,(oldCounts.get(k)||0)+1);}
      let skipped=0;const fresh=[];
      for(const e of parsed.entries){const sig=importSignature(e),count=(localCounts.get(sig)||0)+1;localCounts.set(sig,count);
        if(count<=(oldCounts.get(sig)||0)){skipped++;continue;}fresh.push({...e,sig,merchant:e.merchant.slice(0,150),method:e.method.slice(0,70),cardholder:e.cardholder.slice(0,40)});}
      return {...parsed,entries:fresh,skipped};}

    function importReview(parsed){const n=parsed.entries.length,unclassified=parsed.entries.filter(x=>x.category==='unknown').length, installments=parsed.entries.filter(x=>x.category==='installment').length;
      
      const rowUI=parsed.entries.slice(0,120).map((e,i)=>`<div class="import-item"><div class="col"><div class="title">${esc(e.merchant)}</div><div class="meta">${esc(e.date)} ・ ${esc(e.cardholder||e.method||'')}</div></div><div><div class="amount">${money(e.amount)}</div><select data-import-category="${i}" aria-label="${esc(e.merchant)} の費目">${moneyImport.categories.map(([v,t])=>`<option value="${esc(v)}" ${e.category===v?'selected':''}>${esc(t)}</option>`).join('')}</select></div></div>`).join('');

        <div class="hint">上位120件の分類を変更できます。${n>120?`残り${n-120}件は自動分類のまま保存されます。大量の取引はCSVを分割して取り込んでください。`:''}</div>
        <div class="import-lines">${rowUI}</div>
        <div class="field mt8"><label><input type="checkbox" id="import-income-history" ${parsed.entries.some(e=>e.category==='income')?'checked':''}> 給与と明記された入金を「実際の振込額」にも追加（既存月は上書きしない）</label><div class="hint">給与振込には会社立替精算が含まれ得ます。基本給与の予測額は変更しません。</div></div>`;
      modal('取込前の確認：'+parsed.filename,summary,'確認して取り込む',async()=>{
        if(importState().entries.length+parsed.entries.length>7500)throw Error('保存できる取引は合計7,500件までです。古い取込分を取消してください。');

    function renderSettings(el){el.innerHTML=`<section class="panel"><h2>明細ファイルを自動で反映</h2><p class="disclaimer">楽天カードPDF・CSV、銀行の給与入金CSVなどから支出を自動分類。取引の確認後に、端末内へ暗号化して保存します。</p><button class="btn primary full" data-page-go="import">明細ファイルを読み込む →</button></section><section class="panel"><h2>コンサル結果を反映</h2><p class="disclaimer">このアプリ本体に個人の家計数値は含みません。専用の診断JSONを端末から読み込み、暗号化して保存します。<strong>診断JSONは暗号化されていないため、GitHub等へアップロードしないでください。</strong></p><button class="btn primary full" id="import-consult">診断データ（JSON）を取り込む</button></section><section class="panel"><h2>食費・生活費の分析データ</h2><p class="disclaimer">家計の分析値と実振込履歴を追加できます。プライベートなJSONはGitHubへ上げないでください。</p><button class="btn ghost full" data-page-go="expenses">支出の見える化を開く →</button></section><section class="panel"><h2>バックアップと復元</h2><p class="disclaimer">保存データは暗号化され、このブラウザ内だけに保持されます。ブラウザの閲覧データ消去・端末故障・機種変更に備えて、バックアップファイルを保存してください。</p><div class="actions"><button class="btn primary" id="backup">暗号化バックアップを保存</button><button class="btn" id="restore">バックアップを復元</button></div><div class="notice"><strong>重要：</strong>バックアップは暗号化されていますが、復元には作成時のパスフレーズが必要です。パスフレーズ自体は保存されません。</div></section>

    function editAccount(id){const a=state.accounts.find(x=>x.id===id);if(!a)return;
      const common=`${field(a.kind==='card'?'カード名（自由な呼び名）':'借入先（自由な呼び名）','name','text',a.name,'maxlength="60" required')}${field('毎月の支払日（日）','dueDay','number',a.dueDay,'min="1" max="31" step="1"', '土日祝の引落し調整は反映しません。31日がない月は月末で表示します。')}`;
      const loanFields=`<div class="form-grid">${field('現在の元金残高（円）','balance','number',a.balance,'min="0" step="1" inputmode="numeric"','利息・手数料を除いた残高')}${field('毎月の予定返済額（円）','monthly','number',a.monthly,'min="0" step="1" inputmode="numeric"','元金＋利息などを含む支払予定額')}${field('適用年利（%）','apr','number',a.apr,'min="0" max="100" step="0.001" inputmode="decimal"','分からなければ空欄')}</div>`;
      modal(a.kind==='card'?'クレジットカードの設定':'カードローンの登録',common+(a.kind==='loan'?loanFields:'<div class="helper">カードの借入元金と月額は、下の「分割明細」から登録します。</div>')+`<div class="field"><label for="f-note">メモ（任意）</label><textarea id="f-note" name="note">${esc(a.note)}</textarea></div>`,'保存する',async f=>{
        const name=val(f,'name');if(!name)throw Error('名前を入力してください');const d=num(f,'dueDay');if(d!==null&&(!Number.isInteger(d)||d<1||d>31))throw Error('支払日は1〜31日で入力してください');
        a.name=name;a.dueDay=d;a.note=val(f,'note');
        if(a.kind==='loan'){const b=num(f,'balance'),m=num(f,'monthly'),apr=num(f,'apr');if(!nonNegative(b,m,apr)||apr>100||![b,m].every(x=>x===null||Number.isInteger(x)))throw Error('金額・年利の入力値を確認してください');a.balance=b;a.monthly=m;a.apr=apr;}
      });
    }
    function editItem(accountId,itemId){const card=state.accounts.find(x=>x.id===accountId&&x.kind==='card');if(!card)return;const item=card.items.find(x=>x.id===itemId)||{name:'',balance:null,monthly:null,remaining:null,feeRemaining:null,note:''};
      const body=`${field('分割購入の内容（例：スマホ）','name','text',item.name,'maxlength="80" required')}`+
        `<div class="form-grid">${field('残りの元金（円）','balance','number',item.balance,'min="0" step="1" inputmode="numeric"','分割手数料を除く')}${field('毎月の支払額（円）','monthly','number',item.monthly,'min="0" step="1" inputmode="numeric"','手数料を含む毎月の金額')}${field('残りの支払回数','remaining','number',item.remaining,'min="0" max="600" step="1" inputmode="numeric"')}${field('残りの分割手数料（円）','feeRemaining','number',item.feeRemaining,'min="0" step="1" inputmode="numeric"','分かる場合のみ')}</div>`+
        `<div class="field"><label for="f-note">メモ（任意）</label><textarea id="f-note" name="note">${esc(item.note)}</textarea></div>`+
        `<div class="helper">元金残高の入力に<strong>将来の分割手数料は含めない</strong>でください。支払回数と月額から残高を自動計算すると誤差が出るため、公式明細の数値を優先します。</div>`;
      const hasHistory=state.payments.some(p=>p.itemId===itemId);
      const extra=itemId?`<div class="mt8"><button class="btn sm danger" id="delete-item" ${hasHistory?'disabled':''}>${hasHistory?'返済履歴があるため削除不可':'この分割明細を削除'}</button></div>`:'';
      modal(itemId?'分割明細を編集':'分割明細を追加',body,'保存する',async f=>{
        const name=val(f,'name'),b=num(f,'balance'),m=num(f,'monthly'),r=num(f,'remaining'),fee=num(f,'feeRemaining');
        if(!name)throw Error('明細名が必要です');if(!nonNegative(b,m,r,fee)||![b,m,r,fee].every(x=>x===null||Number.isInteger(x))||r>600)throw Error('元金・月額・回数・手数料は0以上の整数で入力してください');
        const obj={id:itemId||randomId(),name,balance:b,monthly:m,remaining:r,feeRemaining:fee,note:val(f,'note')};
        if(itemId){const index=card.items.findIndex(x=>x.id===itemId);if(index>=0)card.items[index]=obj;}else card.items.push(obj);
      },extra);
      $('#delete-item')?.addEventListener('click',async()=>{if(!confirm('この明細を削除しますか？'))return;card.items=card.items.filter(x=>x.id!==itemId);closeModal();await save();render()});
    }
    function addPayment(){const choices=state.accounts.flatMap(a=>a.kind==='card'?a.items.filter(i=>has(i.balance)).map(i=>({id:a.id+'::'+i.id,label:a.name+' / '+i.name})):has(a.balance)?[{id:a.id,label:a.name}]:[]);
      if(!choices.length){msg('先に借入登録で元金残高を入力してください。');page='debts';render();return;}
      const options=choices.map(c=>`<option value="${esc(c.id)}">${esc(c.label)}</option>`).join('');
      modal('返済を記録',`<div class="field"><label for="f-target">返済先</label><select id="f-target" name="target">${options}</select></div>`+
        `${field('実際の返済日','date','date',nowLocal(),'required')}`+
        `<div class="form-grid">${field('元金の返済額（円）','principal','number','','min="0" step="1" required inputmode="numeric"','この金額だけ借入残高を減らします')}${field('利息（円）','interest','number','0','min="0" step="1" required inputmode="numeric"')}${field('手数料（円）','fee','number','0','min="0" step="1" required inputmode="numeric"')}</div>`+
        `<div class="field"><label for="f-note">メモ（任意）</label><textarea id="f-note" name="note"></textarea></div><div class="helper">返済額の内訳が分からない場合は、利用明細で元金・利息・手数料を確認してから登録してください。引落し総額をそのまま元金欄に入れると残高が少なく表示されます。</div>`,'返済を登録',async f=>{
        const parts=val(f,'target').split('::');const account=state.accounts.find(a=>a.id===parts[0]);const item=parts[1]?account?.items.find(x=>x.id===parts[1]):null;const target=item||account;
        const b=target?.balance,p=num(f,'principal'),interest=num(f,'interest'),fee=num(f,'fee');const date=val(f,'date');
        if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || Number.isNaN(new Date(date+'T12:00:00').getTime()))throw Error('返済日を確認してください');
        if(![p,interest,fee].every(x=>x!==null&&Number.isInteger(x)&&x>=0) || p+interest+fee<=0)throw Error('元金・利息・手数料は0以上で、合計が1円以上になるように入力してください');
        if(!has(b)||p>Number(b))throw Error('元金返済額が登録残高を超えています。借入登録を確認してください');
        target.balance=Number(b)-p;state.payments.push({id:randomId(),accountId:account.id,itemId:item?.id||null,date,principal:p,interest,fee,note:val(f,'note'),createdAt:new Date().toISOString()});
      });
    }
    async function deletePayment(id){const p=state.payments.find(x=>x.id===id);if(!p||!confirm('この返済記録を取り消しますか？取り消すと元金残高が元に戻ります。'))return;const a=state.accounts.find(x=>x.id===p.accountId);const target=p.itemId?a?.items.find(i=>i.id===p.itemId):a;
      if(!target){msg('紐づく借入明細が見つかりません。');return;}target.balance=Number(target.balance)+p.principal;state.payments=state.payments.filter(x=>x.id!==id);const check=state.paymentChecks?.find(c=>c.linkedRepaymentId===id);if(check){check.linkedRepaymentId=null;check.repayment=null;}await save();render();
    }
    async function backup(){try{await pendingSave;const vault=localStorage.getItem(KEY);if(!vault)throw Error('保存データがありません');const blob=new Blob([vault],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`MY_MONEY_backup_${nowLocal()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch(e){msg('バックアップを保存できませんでした：'+e.message);}}
    function requestRestore(){$('#restore-file').value='';$('#restore-file').click();}
    async function onRestoreFile(e){const file=e.target.files?.[0];if(!file)return;if(!confirm('バックアップを復元すると、このブラウザの現在の記録をすべて置き換えます。続行しますか？'))return;
      try{await pendingSave;const text=await file.text();const v=JSON.parse(text);if(!validateVault(v))throw Error('MY MONEY の暗号化バックアップではありません');
        // Don't overwrite an existing vault with corrupt data: first check password and decrypt.
        const pass=prompt('このバックアップを作成した時のパスフレーズを入力してください');if(!pass)return;
        await decryptVault(v,pass);
        localStorage.setItem(KEY,JSON.stringify(v));lock(true);msg('復元が完了しました。バックアップのパスフレーズでロック解除してください。');
      }catch(err){msg('復元できませんでした。ファイル・パスフレーズをご確認ください。\n'+(err.message||''));}
    }
    async function wipe(){if(!confirm('すべての借入情報と返済履歴をこの端末から削除します。よろしいですか？'))return;const answer=prompt('削除するには「全削除」と入力してください');if(answer!=='全削除')return;await pendingSave;localStorage.removeItem(KEY);lock(true);msg('この端末の MY MONEY データを削除しました。');}
    $('#statement-file').addEventListener('change',onStatementFiles);
    $('#consult-file').addEventListener('change',importConsultFile);
    $('#finish-file').addEventListener('change',importFinishFile);
    $('#login-form').addEventListener('submit',async e=>{e.preventDefault();setLoginError('');const pass=$('#pass').value,exists=!!readVault();if(pass.length<8){setLoginError('8文字以上のパスフレーズを入力してください');return;}if(!exists&&pass!==$('#pass2').value){setLoginError('確認用パスフレーズが一致しません');return;}
      const b=$('#login-submit');b.disabled=true;b.textContent='処理中…';try{await start(pass);}catch(err){console.error(err);setLoginError('開けませんでした。パスフレーズまたは保存データを確認してください。');}finally{b.disabled=false;updateLogin();}
    });
    $('#login-restore').onclick=requestRestore;$('#restore-file').addEventListener('change',onRestoreFile);
    $$('.nav-btn').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;render();window.scrollTo(0,0)}));
    ['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,resetIdle,{passive:true}));
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)resetIdle();});
    $('#modal-layer').addEventListener('click',e=>{if(e.target===$('#modal-layer'))closeModal();});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
    const storageAvailable=()=>{try{const k='mymoney_test_storage';localStorage.setItem(k,'ok');localStorage.removeItem(k);return true;}catch{return false;}};
    if(!window.isSecureContext || !window.crypto?.subtle || !storageAvailable()){$('#secure-warning').textContent='この環境では安全な保存が使えません。HTTPSのサイト上で開いてください（GitHub Pagesなど）。';$('#secure-warning').classList.remove('hidden');$('#login-submit').disabled=true;}
    else updateLogin();
  })();
  </script>
  <script>if ('serviceWorker' in navigator && location.protocol==='https:') { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{})); }</script>
